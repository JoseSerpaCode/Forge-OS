<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Forge OS">
  <!--
    «Fragua»: la boca de una fragua sobre su hogar, con las brasas dentro.
    Rejilla de 64 × 64 y módulo de 4 (docs/rediseno/logo.html).

    Este archivo es la referencia de la marca. El mismo trazado va en línea en
    src/components/brand/Logo.astro: si cambia uno, hay que cambiar el otro.

    El icono lleva el símbolo al 70 % dentro de un cuadrado de tinta; el
    cuadrado es solo del icono, no del logo. Las brasas son siempre #E8590C,
    sin depender del tema.
  -->
  <rect width="64" height="64" rx="14" fill="#171614"/>
  <g transform="translate(9.6 9.6) scale(0.7)">
    <path fill="#F8F7F4" fill-rule="evenodd" d="M6 59V53H10V27A22 22 0 0 1 54 27V53H58V59ZM21 53V32A11 11 0 0 1 43 32V53Z"/>
    <path fill="#E8590C" d="M21 53V45A11 8 0 0 1 43 45V53Z"/>
  </g>
</svg>
