name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Unit tests first: ~1s, against the browser install plus a full build
      # that the e2e step needs. A broken run now fails about ten minutes
      # sooner.
      #
      # This ordering used to be impossible: Vitest running first meant several
      # parallel workers applied migrations to a fresh database at once and the
      # job died with "duplicate column name". Fixed in db.ts, which now
      # serialises migrations in an IMMEDIATE transaction.
      # Antes de las pruebas: tarda un segundo y coge imports y variables sin
      # usar, que es la basura que deja un refactor a medias. No formatea nada
      # —solo revisa— para no llenar el historial de cambios de espacios.
      - name: Lint
        run: npx biome check src tests

      - name: Run Vitest
        run: npx vitest run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
